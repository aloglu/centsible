services:
  centsible:
    build: .
    image: ${CENTSIBLE_IMAGE:-centsible:local}
    container_name: centsible
    init: true
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 256mb
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      DATA_DIR: /app/data
      PORT: 3000
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK:-}
      DISCORD_PROXY_BASE: ${DISCORD_PROXY_BASE:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      BACKUP_PASSWORD: ${BACKUP_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      FETCH_ALLOWED_HOSTS: ${FETCH_ALLOWED_HOSTS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
